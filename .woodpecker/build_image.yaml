when:
  - event: push
    branch: main
  - event: cron
    cron: Weekly

steps:
- name: publish
  image: woodpeckerci/plugin-docker-buildx
  settings:
    repo: bentasker12/tplink_to_influxdb
    platforms: darwin/arm64,freebsd/amd64,linux/amd64,linux/arm64/v8
    tags: weekly
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password    
